<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VM Renovations, pick a design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #12100e; color: #f3ece3; font-family: Outfit, sans-serif; }
    main { width: min(880px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 96px; }
    h1 { font-family: "Playfair Display", serif; font-weight: 500; font-size: clamp(40px, 6vw, 64px); margin: 0 0 12px; }
    p { color: #d9cfc2; max-width: 36rem; line-height: 1.5; }
    ul { list-style: none; padding: 0; margin: 36px 0 0; display: grid; gap: 14px; }
    a { display: block; padding: 22px 24px; border: 1px solid rgba(198,163,106,.35); color: inherit; text-decoration: none; }
    a:hover { border-color: #c6a36a; }
    strong { display: block; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: #c6a36a; margin-bottom: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>VM Renovations</h1>
    <p>Three designs, same pages. Open each one and say which you prefer.</p>
    <ul>
      <li><a href="option-1/"><strong>Option one</strong>Dark, cream type, gold.</a></li>
      <li><a href="option-2/"><strong>Option two</strong>Cream page, navy type, gold.</a></li>
      <li><a href="option-3/"><strong>Option three</strong>Dark stone, no gold.</a></li>
    </ul>
  </main>
</body>
</html>
